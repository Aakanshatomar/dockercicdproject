apiVersion: apps/v1
kind: Deployment

metadata:
  name: docker-testapp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: docker-testapp

  template:
    metadata:
      labels:
        app: docker-testapp

    spec:
      containers:
        - name: docker-testapp
          image: tomarakansha151/docker-testapp:latest
          ports:
            - containerPort: 5050

apiVersion: v1
kind: Service
metadata: 
  name: docker-testapp
spec:
  type: NodePort
  selector: 
   app: docker-testapp
  ports:
    - port: 5050
      targetPort: 5050